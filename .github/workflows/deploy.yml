name: Validate and deploy to Cloudflare

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  validate:
    name: Quality gates and Linux build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript tests
        run: npm test

      - name: Run Python tests
        run: npm run test:python

      - name: Check student paid-provider guards
        run: npm run check:student-paid-guards

      - name: Check BYOK isolation guards
        run: npm run check:byok-isolation

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check D1 migration structure
        run: npm run check:migrations

      - name: Check Cloudflare binding types
        run: npm run check:cf-types

      - name: Audit dependencies
        run: npm run check:audit

      - name: Check business rules sync
        run: node scripts/check-business-rules.mjs

      - name: Build with OpenNext on Linux
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAAES0vIKvFezd0jFe"

      - name: Validate Worker bundle without deploying
        run: npx wrangler deploy --dry-run --config wrangler.jsonc

  deploy:
    name: Deploy production
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://www.discoverkeywords.co

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with OpenNext on Linux
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAAES0vIKvFezd0jFe"

      - name: Retain active production static assets
        run: npm run retain:production-assets
        env:
          PRODUCTION_ASSET_BASE_URL: https://www.discoverkeywords.co

      - name: Validate retained candidate bundle
        run: npx wrangler versions upload --dry-run --config wrangler.jsonc

      - name: Capture D1 Time Travel rollback bookmark
        run: npx wrangler d1 time-travel info ai-trends --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Preview pending D1 migrations
        run: node scripts/schema/apply-d1-migrations.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply pending D1 migrations
        run: node scripts/schema/apply-d1-migrations.mjs --apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify D1 migration ledger
        run: node scripts/schema/apply-d1-migrations.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload production candidate without traffic
        id: upload_worker
        run: >-
          npx wrangler versions upload
          --config wrangler.jsonc
          --keep-vars
          --strict
          --tag "$GITHUB_SHA"
          --preview-alias production-candidate
          --message "production candidate $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke production candidate preview
        run: npm run smoke:production
        env:
          SMOKE_BASE_URL: https://production-candidate-google-keywords.potter-faa.workers.dev
          SMOKE_MAX_ATTEMPTS: "6"
          SMOKE_RETRY_DELAY_MS: "5000"

      - name: Deploy validated candidate at 100 percent
        id: deploy_worker
        run: >-
          npx wrangler versions deploy
          --config wrangler.jsonc
          --version-tag "$GITHUB_SHA"
          --percentage 100
          --yes
          --message "deploy validated production candidate $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run post-deploy no-cost smoke tests
        run: npm run smoke:production
        env:
          SMOKE_BASE_URL: https://www.discoverkeywords.co
          SMOKE_MAX_ATTEMPTS: "6"
          SMOKE_RETRY_DELAY_MS: "5000"

      - name: Roll back Worker after failed post-deploy checks
        if: failure() && steps.deploy_worker.outcome == 'success'
        run: |
          npx wrangler rollback --yes --message "Automatic rollback after failed post-deploy smoke"
          npm run smoke:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMOKE_BASE_URL: https://www.discoverkeywords.co
          SMOKE_MAX_ATTEMPTS: "6"
          SMOKE_RETRY_DELAY_MS: "5000"
